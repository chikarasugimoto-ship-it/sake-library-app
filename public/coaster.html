<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SUGIDAMA SAKE LIBRARY — Coaster</title>
<meta property="og:title" content="SUGIDAMA SAKE LIBRARY — コースター"><meta property="og:description" content="飲んだ日本酒が、図鑑になる。煮干しと日本酒 すぎだま。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--green:#16352a;--green-2:#0f2a20;--gilt:#b89255;--gilt-soft:#caa86a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100dvh;background:radial-gradient(120% 80% at 50% 0%, #ded9cf 0%, #cdc9c1 60%, #c2bdb4 100%);font-family:"Shippori Mincho B1",serif;color:#3c3f44;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:48px 22px;}
.lead{text-align:center;}
.lead .en{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.4em;color:#8a857a;text-transform:uppercase;}
.lead h1{font-size:19px;font-weight:600;letter-spacing:.08em;margin-top:8px;color:#2c2e30;}
.coaster{width:min(82vw,400px);aspect-ratio:1;border-radius:9%;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 34%, #1d4031 0%, var(--green) 46%, var(--green-2) 100%);box-shadow:0 30px 60px rgba(20,30,24,.4),0 4px 10px rgba(20,30,24,.25);}
.coaster::after{content:"";position:absolute;inset:4.2%;border-radius:7%;border:1px solid rgba(255,255,255,.13);pointer-events:none;}
.face{position:absolute;inset:0;color:#f3efe6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13% 0 12%;z-index:2;}
.mark{width:15%;aspect-ratio:1;margin:0 auto;}.mark svg{width:100%;height:100%;display:block;}
.wm{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(9px,2.6vw,11px);letter-spacing:.5em;color:var(--gilt-soft);text-indent:.5em;margin-top:4%;text-align:center;}
.rule{width:16%;height:1px;background:linear-gradient(90deg,transparent,var(--gilt),transparent);margin:3.5% auto 0;}
.tile{width:34%;aspect-ratio:1;background:#f4efe4;border-radius:8%;display:flex;align-items:center;justify-content:center;padding:6%;margin:0 auto;}.tile svg{width:100%;height:100%;}
.cap-qr{font-family:"Cormorant Garamond",serif;font-size:clamp(7px,2vw,9px);letter-spacing:.34em;text-align:center;color:rgba(243,239,230,.5);margin-top:3%;text-transform:uppercase;}
.tagline{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:clamp(15px,4.2vw,18px);letter-spacing:.1em;text-align:center;line-height:1.1;}
.tagline .en{display:block;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(8px,2.2vw,10px);letter-spacing:.26em;color:var(--gilt-soft);margin-top:4%;text-transform:uppercase;}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;z-index:5;}
.foot{text-align:center;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;font-size:11px;color:#8a857a;line-height:1.9;}
.foot a{color:#2f5d46;text-decoration:none;font-weight:600;}

<script>
  function cedarMark(stroke){
    const cx=50, cy=64, rings=[{r:25,n:28,s:2.9},{r:19,n:21,s:2.8},{r:13,n:14,s:2.6},{r:7,n:8,s:2.5},{r:2,n:1,s:2.4}];
    let dots='';
    rings.forEach((ring,ri)=>{for(let i=0;i<ring.n;i++){const a=(i/ring.n)*Math.PI*2+ri*0.4;dots+='<circle cx="'+(cx+Math.cos(a)*ring.r).toFixed(1)+'" cy="'+(cy+Math.sin(a)*ring.r).toFixed(1)+'" r="'+ring.s+'" fill="'+stroke+'"/>';}});
    const roof='<path d="M50 6 Q51.5 6 53 7.4 L83 24 Q88 27 82.5 28.4 L17.5 28.4 Q12 27 17 24 L47 7.4 Q48.5 6 50 6 Z" fill="'+stroke+'"/><rect x="16" y="29.6" width="68" height="2" rx="1" fill="'+stroke+'"/><rect x="49" y="32.5" width="2" height="7" rx="1" fill="'+stroke+'"/>';
    return '<svg viewBox="0 0 100 100">'+roof+'<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="none" stroke="'+stroke+'" stroke-width="0.7" opacity=".4"/>'+dots+'</svg>';
  }
  document.querySelectorAll('[data-mark]').forEach(el=>el.innerHTML=cedarMark('#caa86a'));
  const grain='<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>';
  document.querySelectorAll('[data-grain]').forEach(el=>el.innerHTML=grain);</script></body></html>
